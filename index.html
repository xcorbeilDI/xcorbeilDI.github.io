<!doctype html>

<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QA Test Hub</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://www.gstatic.com/firebasejs/7.4.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/7.4.0/firebase-messaging.js"></script>
    <script src="https://docker.didev.ca/T/OFC4/WPS/210354/15313/fSlDFWlX700g9O5D0n2wUfY0iss9v9PF/DI.WebPush-min.js"></script>
  </head>

  <body>
    <main class="page">
      <h1>QA Test Homepage</h1>
      <p class="subtitle">Simple tabs to run quick test scenarios.</p>

      <test-tabs aria-label="Test tabs">
        <test-tab
          tab-id="tab-webpush-existing"
          title="WebPush Existing"
          src="tabs/webpush.html"
          active
        ></test-tab>

        <test-tab
          tab-id="tab-api"
          title="API Smoke"
          src="tabs/api.html"
        ></test-tab>

        <test-tab
          tab-id="tab-notes"
          title="Notes"
          src="tabs/notes.html"
        ></test-tab>
      </test-tabs>
    </main>

    <script src="components.js"></script>
    <script src="webpush-status.js"></script>
  </body>
</html>
